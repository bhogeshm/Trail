<!doctype html>
<html lang="en" data-resolution="portrait-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <title>NPAV Navratri — 9 Days Intro Reel</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Gloock";
        src: url("assets/fonts/Gloock-Regular.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-400.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-600.ttf") format("truetype");
        font-weight: 600;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-800.ttf") format("truetype");
        font-weight: 800;
      }
      :root {
        --gold: #f5c766;
        --gold-hi: #fff1c8;
        --gold-lo: #b9822a;
        --crimson: #a5142c;
        --ink: #050204;
        --cyan: #5cc8ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 2160px;
        height: 3840px;
        overflow: hidden;
        background: #050204;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050204;
        font-family: "Montserrat", sans-serif;
        color: #fff;
      }
      /* Untimed full-bleed layers */
      .full {
        position: absolute;
        inset: 0;
        width: 2160px;
        height: 3840px;
      }
      #world {
        z-index: 1;
      }
      #fx {
        z-index: 8;
        pointer-events: none;
      }
      #vignette {
        z-index: 9;
        background: radial-gradient(
          ellipse 75% 60% at 50% 50%,
          rgba(0, 0, 0, 0) 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      #flash {
        z-index: 20;
        opacity: 0;
        background: radial-gradient(
          circle at 50% 50%,
          #fffaf0 0%,
          #ffe6ad 35%,
          #f2b552 70%,
          #c47a1e 100%
        );
      }
      #blackout {
        z-index: 9;
        opacity: 0;
        background: #000;
      }
      /* Timed layers: each clip holds a 1080x1920 design stage scaled 2x to 4K */
      .clip {
        position: absolute;
        inset: 0;
        width: 2160px;
        height: 3840px;
      }
      .objects {
        z-index: 5;
      }
      .texts {
        z-index: 10;
      }
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform: scale(2);
        transform-origin: 0 0;
      }
      .frame {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .row {
        position: absolute;
        left: 60px;
        width: 960px;
        text-align: center;
        display: block;
      }
      .serif {
        font-family: "Gloock", serif;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.01em;
      }
      .kicker {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        line-height: 1.15;
      }
      .gold {
        color: #f7cf78;
        background: linear-gradient(
          180deg,
          #fff4d2 0%,
          #f9d585 38%,
          #e0a443 68%,
          #ffe7a6 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glow {
        filter: drop-shadow(0 0 18px rgba(255, 196, 92, 0.45))
          drop-shadow(0 4px 2px rgba(40, 6, 10, 0.6));
      }
      .ivory {
        color: #fff6e6;
        text-shadow: 0 0 22px rgba(255, 200, 110, 0.35), 0 3px 3px rgba(20, 2, 6, 0.7);
      }
      .inl {
        display: inline-block;
        vertical-align: middle;
      }

      /* Scene 2 node labels + shield */
      #t2-labels {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .nlabel {
        position: absolute;
        width: 80px;
        height: 30px;
        margin-left: -40px;
        margin-top: -15px;
        text-align: center;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.12em;
        color: #ffe3a1;
        text-shadow: 0 0 12px rgba(255, 190, 80, 0.8);
      }
      #t2-shield {
        position: absolute;
        left: 460px;
        top: 920px;
        width: 160px;
        height: 180px;
      }

      /* Scene 3 voucher cards */
      .card-wrap {
        position: absolute;
        top: 720px;
        width: 430px;
        height: 580px;
      }
      #o3-left {
        left: 85px;
      }
      #o3-right {
        left: 565px;
      }
      .card {
        position: absolute;
        inset: 0;
        border-radius: 38px;
        overflow: hidden;
        background:
          linear-gradient(160deg, rgba(255, 236, 196, 0.2) 0%, rgba(255, 255, 255, 0.04) 40%, rgba(255, 210, 140, 0.1) 100%),
          linear-gradient(180deg, #3b0a14 0%, #1d050b 100%);
        border: 2px solid rgba(255, 214, 140, 0.55);
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.55),
          inset 0 2px 0 rgba(255, 244, 210, 0.55),
          inset 0 -30px 60px rgba(255, 170, 60, 0.08);
      }
      .card-glow {
        position: absolute;
        inset: -40px;
        border-radius: 70px;
        background: radial-gradient(ellipse at 50% 50%, rgba(255, 200, 100, 0.55), rgba(255, 170, 60, 0) 70%);
        opacity: 0;
      }
      .card-sheen {
        position: absolute;
        top: -100px;
        left: -260px;
        width: 160px;
        height: 800px;
        background: linear-gradient(90deg, rgba(255, 240, 200, 0), rgba(255, 244, 214, 0.55), rgba(255, 240, 200, 0));
        transform-origin: 50% 50%;
        rotate: 18deg;
      }
      .card-edge {
        position: absolute;
        left: 30px;
        right: 30px;
        top: 0;
        height: 3px;
        background: linear-gradient(90deg, rgba(255, 220, 150, 0), #ffe3a1, rgba(255, 220, 150, 0));
      }
      .card-plat {
        position: absolute;
        top: 52px;
        left: 0;
        width: 100%;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .card-plat span {
        font-weight: 800;
        font-size: 27px;
        letter-spacing: 0.2em;
        color: #fff4de;
      }
      .card-rule {
        position: absolute;
        top: 140px;
        left: 70px;
        width: 290px;
        height: 2px;
        background: linear-gradient(90deg, rgba(255, 210, 140, 0), rgba(255, 210, 140, 0.8), rgba(255, 210, 140, 0));
      }
      .card-num {
        position: absolute;
        top: 160px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 230px;
      }
      .card-label {
        position: absolute;
        top: 420px;
        left: 20px;
        width: 390px;
        text-align: center;
        font-weight: 800;
        font-size: 33px;
        letter-spacing: 0.08em;
        line-height: 1.2;
        color: #fff6e6;
      }
      .card-chip {
        position: absolute;
        top: 500px;
        left: 135px;
        width: 160px;
        height: 40px;
        border-radius: 20px;
        border: 1.5px solid rgba(255, 214, 140, 0.7);
        text-align: center;
        line-height: 37px;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: 0.3em;
        color: #ffe3a1;
      }

      /* Scene 4 gift */
      #o4-giftwrap {
        position: absolute;
        left: 300px;
        top: 760px;
        width: 480px;
        height: 540px;
      }
      #o4-glow {
        position: absolute;
        left: 240px;
        top: 720px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff8e4 0%, #ffd889 30%, rgba(245, 170, 60, 0.55) 55%, rgba(200, 100, 20, 0) 72%);
        opacity: 0;
      }

      /* Scene 5 watch */
      #o5-watchwrap {
        position: absolute;
        left: 340px;
        top: 530px;
        width: 400px;
        height: 820px;
      }

      /* Scene 6 CTA */
      .scrim {
        position: absolute;
        left: 0;
        width: 1080px;
        height: 760px;
        top: 520px;
        background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(8, 2, 6, 0.6), rgba(8, 2, 6, 0) 100%);
      }
      .pill {
        display: inline-block;
        padding: 18px 40px;
        border-radius: 60px;
        border: 2px solid rgba(255, 214, 140, 0.85);
        background: linear-gradient(180deg, rgba(120, 18, 34, 0.85), rgba(60, 6, 16, 0.85));
        box-shadow: 0 0 40px rgba(255, 190, 90, 0.35), inset 0 1px 0 rgba(255, 240, 200, 0.6);
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 0.12em;
        color: #fff4de;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="2160"
      data-height="3840"
    >
      <!-- Shared procedural world (Garba, rings, halos, light) — untimed, driven by the timeline -->
      <canvas id="world" class="full" data-layout-allow-overflow width="2160" height="3840"></canvas>

      <!-- ============ SCENE 01 — THE HOOK (0–3) ============ -->
      <section id="t1" class="clip texts" data-start="0" data-duration="3.15" data-track-index="10">
        <div class="stage">
          <div id="t1-frame" class="frame">
            <div id="t1-a" class="row kicker ivory" style="top: 290px; font-size: 46px">This</div>
            <div id="t1-b" class="row glow" style="top: 360px">
              <div class="serif gold" style="font-size: 168px">Navratri</div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ SCENE 02 — 9 DAYS / 9 DROPS (3–6) ============ -->
      <section id="o2" class="clip objects" data-start="3" data-duration="3.15" data-track-index="5">
        <div class="stage">
          <div id="t2-labels"></div>
          <div id="t2-shield">
            <svg width="160" height="180" viewBox="0 0 160 180">
              <defs>
                <linearGradient id="shg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#fff1c8" />
                  <stop offset="0.5" stop-color="#f2bf5c" />
                  <stop offset="1" stop-color="#a8701f" />
                </linearGradient>
                <radialGradient id="shb" cx="0.5" cy="0.45" r="0.6">
                  <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.45" />
                  <stop offset="1" stop-color="#0a1830" stop-opacity="0.1" />
                </radialGradient>
              </defs>
              <path d="M80 8 L146 32 V86 C146 128 116 158 80 172 C44 158 14 128 14 86 V32 Z" fill="url(#shb)" stroke="url(#shg)" stroke-width="6" />
              <path d="M80 30 L126 47 V88 C126 118 106 140 80 151 C54 140 34 118 34 88 V47 Z" fill="none" stroke="#5cc8ff" stroke-opacity="0.55" stroke-width="2" />
              <circle cx="80" cy="82" r="15" fill="url(#shg)" />
              <path d="M73 92 L87 92 L91 124 L69 124 Z" fill="url(#shg)" />
            </svg>
          </div>
        </div>
      </section>
      <section id="t2" class="clip texts" data-start="3.1" data-duration="3.05" data-track-index="11">
        <div class="stage">
          <div id="t2-frame" class="frame">
            <div id="t2-a" class="row glow" style="top: 260px">
              <div class="serif gold" style="font-size: 176px">9 Days.</div>
            </div>
            <div id="t2-b" class="row kicker ivory" style="top: 470px; font-size: 50px; letter-spacing: 0.14em">
              9 Interactive Drops.
            </div>
          </div>
        </div>
      </section>

      <!-- ============ SCENE 03 — DAILY PRIZES (6–10) ============ -->
      <section id="o3" class="clip objects" data-start="6" data-duration="4.05" data-track-index="6">
        <div class="stage">
          <div id="o3-frame" class="frame">
            <div id="o3-left" class="card-wrap" data-layout-allow-overlap data-layout-allow-occlusion>
              <div id="o3-glowL" class="card-glow"></div>
              <div class="card">
                <div class="card-edge"></div>
                <div id="o3-sheenL" class="card-sheen" data-layout-allow-overflow></div>
                <div class="card-plat">
                  <svg width="44" height="44" viewBox="0 0 44 44">
                    <rect x="3" y="3" width="38" height="38" rx="11" fill="none" stroke="#ffd98a" stroke-width="3.5" />
                    <circle cx="22" cy="22" r="8.5" fill="none" stroke="#ffd98a" stroke-width="3.5" />
                    <circle cx="32.5" cy="11.5" r="2.4" fill="#ffd98a" />
                  </svg>
                  <span>INSTAGRAM</span>
                </div>
                <div class="card-rule"></div>
                <div class="card-num serif gold">1</div>
                <div class="card-label">AMAZON VOUCHER</div>
                <div class="card-chip">DAILY</div>
              </div>
            </div>
            <div id="o3-right" class="card-wrap" data-layout-allow-overlap data-layout-allow-occlusion>
              <div id="o3-glowR" class="card-glow"></div>
              <div class="card">
                <div class="card-edge"></div>
                <div id="o3-sheenR" class="card-sheen" data-layout-allow-overflow></div>
                <div class="card-plat">
                  <svg width="44" height="44" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="19" fill="none" stroke="#ffd98a" stroke-width="3.5" />
                    <path d="M24.5 36 V24.5 H29 L29.7 19.5 H24.5 V16.6 C24.5 15.2 25 14.3 27 14.3 H29.8 V9.9 C29.3 9.8 27.7 9.7 25.9 9.7 C22 9.7 19.5 12 19.5 16.2 V19.5 H15 V24.5 H19.5 V36" fill="#ffd98a" />
                  </svg>
                  <span>FACEBOOK</span>
                </div>
                <div class="card-rule"></div>
                <div class="card-num serif gold">1</div>
                <div class="card-label">AMAZON VOUCHER</div>
                <div class="card-chip">DAILY</div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="t3" class="clip texts" data-start="6.05" data-duration="3.95" data-track-index="12">
        <div class="stage">
          <div id="t3-frame" class="frame">
            <div id="t3-a" class="row glow" style="top: 300px">
              <div class="serif gold" style="font-size: 104px; line-height: 1.04">Exciting Prizes</div>
              <div style="margin-top: 22px; height: 70px">
                <span class="kicker ivory inl" style="font-size: 50px; letter-spacing: 0.16em">Every Day!</span>
                <svg class="inl" width="62" height="62" viewBox="0 0 62 62" style="margin-left: 14px; margin-top: -10px">
                  <rect x="7" y="25" width="48" height="31" rx="4" fill="#a5142c" stroke="#ffd98a" stroke-width="3" />
                  <rect x="4" y="17" width="54" height="11" rx="3" fill="#c21a3a" stroke="#ffd98a" stroke-width="3" />
                  <rect x="27" y="17" width="8" height="39" fill="#ffd98a" />
                  <path d="M31 17 C24 4 12 8 17 14 C20 17 27 17 31 17 C35 17 42 17 45 14 C50 8 38 4 31 17 Z" fill="none" stroke="#ffd98a" stroke-width="3" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ SCENE 04 — SURPRISE GIFT (10–14) ============ -->
      <section id="o4" class="clip objects" data-start="10" data-duration="4.15" data-track-index="7">
        <div class="stage">
          <div id="o4-frame" class="frame">
            <div id="o4-giftwrap">
              <svg width="480" height="540" viewBox="0 0 480 540">
                <defs>
                  <linearGradient id="gbody" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#4d0612" />
                    <stop offset="0.35" stop-color="#9c1229" />
                    <stop offset="0.6" stop-color="#b8182f" />
                    <stop offset="1" stop-color="#3f040e" />
                  </linearGradient>
                  <linearGradient id="glid" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#5e0816" />
                    <stop offset="0.45" stop-color="#c41d36" />
                    <stop offset="1" stop-color="#4a0510" />
                  </linearGradient>
                  <linearGradient id="gtop" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#7a0b1d" />
                    <stop offset="1" stop-color="#d42a43" />
                  </linearGradient>
                  <linearGradient id="grib" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#8a5a18" />
                    <stop offset="0.3" stop-color="#e8b350" />
                    <stop offset="0.5" stop-color="#fff0c0" />
                    <stop offset="0.7" stop-color="#d79a35" />
                    <stop offset="1" stop-color="#7a4c12" />
                  </linearGradient>
                  <linearGradient id="gbow" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fff0c0" />
                    <stop offset="0.5" stop-color="#e3a845" />
                    <stop offset="1" stop-color="#8a5a18" />
                  </linearGradient>
                  <pattern id="gpat" width="36" height="36" patternUnits="userSpaceOnUse">
                    <path d="M18 2 L34 18 L18 34 L2 18 Z" fill="none" stroke="#ffd98a" stroke-opacity="0.13" stroke-width="1.5" />
                    <circle cx="18" cy="18" r="2" fill="#ffd98a" fill-opacity="0.18" />
                  </pattern>
                  <clipPath id="gribclip">
                    <rect x="212" y="260" width="56" height="270" />
                    <rect x="206" y="186" width="68" height="78" />
                    <polygon points="214,186 266,186 262,146 218,146" />
                  </clipPath>
                </defs>
                <!-- body -->
                <rect x="58" y="258" width="364" height="272" rx="8" fill="url(#gbody)" />
                <rect x="58" y="258" width="364" height="272" rx="8" fill="url(#gpat)" />
                <!-- lid front -->
                <rect x="38" y="186" width="404" height="80" rx="10" fill="url(#glid)" />
                <rect x="38" y="186" width="404" height="80" rx="10" fill="url(#gpat)" />
                <rect x="38" y="258" width="404" height="10" fill="#2a030a" opacity="0.55" />
                <!-- lid top (perspective) -->
                <polygon points="38,188 442,188 410,146 70,146" fill="url(#gtop)" />
                <line x1="70" y1="146" x2="410" y2="146" stroke="#ff8e9c" stroke-opacity="0.5" stroke-width="2" />
                <!-- ribbons -->
                <g>
                  <rect x="212" y="266" width="56" height="264" fill="url(#grib)" />
                  <rect x="206" y="186" width="68" height="80" fill="url(#grib)" />
                  <polygon points="206,188 274,188 264,146 216,146" fill="url(#grib)" />
                </g>
                <g clip-path="url(#gribclip)">
                  <rect id="o4-sheen" x="150" y="100" width="44" height="460" fill="#fffbe8" opacity="0.85" transform="rotate(-20 172 330)" />
                </g>
                <!-- bow -->
                <path d="M240 150 C200 70 120 70 140 120 C150 146 205 150 240 150 Z" fill="url(#gbow)" stroke="#7a4c12" stroke-width="2" />
                <path d="M240 150 C280 70 360 70 340 120 C330 146 275 150 240 150 Z" fill="url(#gbow)" stroke="#7a4c12" stroke-width="2" />
                <path d="M226 152 L196 214 L214 208 L222 226 L238 156 Z" fill="url(#grib)" />
                <path d="M254 152 L284 214 L266 208 L258 226 L242 156 Z" fill="url(#grib)" />
                <ellipse cx="240" cy="148" rx="20" ry="16" fill="url(#gbow)" stroke="#7a4c12" stroke-width="2" />
                <ellipse cx="234" cy="142" rx="7" ry="4" fill="#fffbe8" opacity="0.8" />
              </svg>
            </div>
            <div id="o4-glow"></div>
          </div>
        </div>
      </section>
      <section id="t4" class="clip texts" data-start="10.1" data-duration="4" data-track-index="13">
        <div class="stage">
          <div id="t4-frame" class="frame">
            <div id="t4-a" class="row kicker ivory" style="top: 290px; font-size: 54px; letter-spacing: 0.4em">Plus…</div>
            <div id="t4-b" class="row glow" style="top: 380px">
              <span class="serif gold inl" style="font-size: 104px">A Surprise Gift!</span>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ SCENE 05 — SMARTWATCH (14–17) ============ -->
      <section id="o5" class="clip objects" data-start="14" data-duration="3.15" data-track-index="8">
        <div class="stage">
          <div id="o5-frame" class="frame">
            <div id="o5-watchwrap" data-layout-allow-occlusion>
              <div id="o5-spin" style="position:absolute;left:0;top:0;width:400px;height:820px">
              <svg width="400" height="820" viewBox="0 0 400 820">
                <defs>
                  <linearGradient id="wcase" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fff1c4" />
                    <stop offset="0.22" stop-color="#c8953c" />
                    <stop offset="0.45" stop-color="#f6dc9a" />
                    <stop offset="0.7" stop-color="#8a6526" />
                    <stop offset="1" stop-color="#e7c27a" />
                  </linearGradient>
                  <linearGradient id="wstrap" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#0f0f14" />
                    <stop offset="0.5" stop-color="#2e2d36" />
                    <stop offset="1" stop-color="#0f0f14" />
                  </linearGradient>
                  <linearGradient id="wfadeT" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fff" stop-opacity="0" />
                    <stop offset="0.55" stop-color="#fff" stop-opacity="1" />
                  </linearGradient>

    <script>
      (function () {
        // ---------- deterministic helpers ----------
        function hash(a, b) {
          var n = (a | 0) * 374761393 + (b | 0) * 668265263;
          n = (n ^ (n >>> 13)) * 1274126177;
          n = n ^ (n >>> 16);
          return (n >>> 0) / 4294967295;
        }
        function clamp(v, a, b) {
          return v < a ? a : v > b ? b : v;
        }
        function lerp(a, b, t) {
          return a + (b - a) * t;
        }
        function smooth(e0, e1, x) {
          var t = clamp((x - e0) / (e1 - e0), 0, 1);
          return t * t * (3 - 2 * t);
        }
        function eio(t) {
          t = clamp(t, 0, 1);
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        function eout(t) {
          t = clamp(t, 0, 1);
          return 1 - Math.pow(1 - t, 3);
        }
        function frac(x) {
          return x - Math.floor(x);
        }
        var TAU = Math.PI * 2;

        // ---------- canvases ----------
        var world = document.getElementById("world");
        var fx = document.getElementById("fx");
        var W = world.getContext("2d");
        var F = fx.getContext("2d");

        function sprite(r, g, b) {
          var c = document.createElement("canvas");
          c.width = c.height = 128;
          var x = c.getContext("2d");
          var gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
          gr.addColorStop(0, "rgba(" + r + "," + g + "," + b + ",1)");
          gr.addColorStop(0.25, "rgba(" + r + "," + g + "," + b + ",0.55)");
          gr.addColorStop(0.6, "rgba(" + r + "," + g + "," + b + ",0.12)");
          gr.addColorStop(1, "rgba(" + r + "," + g + "," + b + ",0)");
          x.fillStyle = gr;
          x.fillRect(0, 0, 128, 128);
          return c;
        }
        var GOLD = sprite(255, 196, 92);
        var WARM = sprite(255, 232, 180);
        var CRIM = sprite(220, 30, 60);
        var BLUE = sprite(92, 200, 255);
        var WHITE = sprite(255, 250, 235);

        var GA = 1; // scene alpha multiplier
        function glow(ctx, x, y, r, spr, a) {
          if (a <= 0.003 || r <= 0) return;
          ctx.globalAlpha = clamp(a * GA, 0, 1);
          ctx.drawImage(spr, x - r, y - r, r * 2, r * 2);
        }
        function alpha(ctx, a) {
          ctx.globalAlpha = clamp(a * GA, 0, 1);
        }

        // Nine golden points — the hero device
        function nine(ctx, cx, cy, rx, ry, rot, litFn, size, t) {
          for (var i = 0; i < 9; i++) {
            var a = -Math.PI / 2 + (i * TAU) / 9 + rot;
            var x = cx + Math.cos(a) * rx;
            var y = cy + Math.sin(a) * ry;
            var l = litFn(i);
            var tw = 0.85 + 0.15 * Math.sin(t * 5 + i * 1.7);
            ctx.globalCompositeOperation = "lighter";
            glow(ctx, x, y, size * 3.6, GOLD, (0.12 + 0.6 * l) * tw);
            glow(ctx, x, y, size * 1.3, WARM, 0.15 + 0.85 * l);
            ctx.globalCompositeOperation = "source-over";
            alpha(ctx, 0.35 + 0.65 * l);
            ctx.fillStyle = l > 0.5 ? "#fff6dc" : "#c9934a";
            ctx.beginPath();
            ctx.arc(x, y, size * (0.32 + 0.12 * l), 0, TAU);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        var SKIRTS = ["#b3122e", "#c2185b", "#e8781a", "#138a5e", "#2446a8", "#e3a92b", "#8e1fa0"];
        var CHOLI = ["#e3a92b", "#1b6b8f", "#b3122e", "#f0d9a0", "#7a1030", "#138a5e"];

        // ================= SCENE 1: aerial Garba =================
        var RINGS1 = [148, 214, 280, 346, 412, 478];
        function dancerTop(ctx, x, y, a, t, id, fade) {
          var col = SKIRTS[id % SKIRTS.length];
          var spin = t * (3.2 + hash(id, 3) * 2.2) + id * 1.3;
          ctx.save();
          ctx.translate(x, y);
          ctx.globalCompositeOperation = "lighter";
          glow(ctx, 0, 0, 30, GOLD, 0.16 * fade);
          ctx.globalCompositeOperation = "source-over";
          ctx.rotate(a + spin * 0.25);
          // flared skirt (lobed)
          alpha(ctx, fade);
          ctx.beginPath();
          var lobes = 9;
          for (var k = 0; k <= 36; k++) {
            var th = (k / 36) * TAU;
            var r = 12.5 + 1.8 * Math.sin(th * lobes + spin * 2) + 1.2 * Math.sin(spin * 3);
            var px = Math.cos(th) * r,
              py = Math.sin(th) * r;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.fillStyle = col;
          ctx.fill();
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = "rgba(255,214,140,0.85)";
          ctx.stroke();
          // arms + dandiya
          var sw = Math.sin(t * 7 + id) * 0.5;
          ctx.strokeStyle = "#7a4a30";
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(15 * Math.cos(sw), 15 * Math.sin(sw) - 3);
          ctx.moveTo(0, 0);
          ctx.lineTo(-15 * Math.cos(-sw), -15 * Math.sin(-sw) - 3);
          ctx.stroke();
          ctx.strokeStyle = "#ffd98a";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(15 * Math.cos(sw), 15 * Math.sin(sw) - 3);
          ctx.lineTo(24 * Math.cos(sw + 0.5), 24 * Math.sin(sw + 0.5) - 3);
          ctx.moveTo(-15 * Math.cos(-sw), -15 * Math.sin(-sw) - 3);
          ctx.lineTo(-24 * Math.cos(-sw - 0.5), -24 * Math.sin(-sw - 0.5) - 3);
          ctx.stroke();
          // choli + head
          ctx.fillStyle = CHOLI[id % CHOLI.length];
          ctx.beginPath();
          ctx.arc(0, 0, 6, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "#140806";
          ctx.beginPath();
          ctx.arc(0, -1, 4.2, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        function drawS1(ctx, t) {
          var u = clamp(t / 3.05, 0, 1);
          var e = eio(u);
          var k = 0.42 * Math.pow(2.3 / 0.42, e);
          var rot = -0.55 + 0.6 * e;
          var dig = smooth(2.1, 2.95, t);
          ctx.save();
          ctx.translate(540, 1010);
          ctx.rotate(rot);
          ctx.scale(k, k);
          // floor
          var fl = ctx.createRadialGradient(0, 0, 0, 0, 0, 1500);
          fl.addColorStop(0, "#40091a");
          fl.addColorStop(0.3, "#22060e");
          fl.addColorStop(0.65, "#0d0306");
          fl.addColorStop(1, "#040103");
          alpha(ctx, 1);
          ctx.fillStyle = fl;
          ctx.fillRect(-3000, -3000, 6000, 6000);
          ctx.globalCompositeOperation = "lighter";
          for (var i = 0; i < 6; i++) {
            var ang = i * 1.047 + t * 0.12;
            glow(ctx, Math.cos(ang) * 560, Math.sin(ang) * 560, 460, i % 2 ? GOLD : CRIM, 0.22);
          }
          glow(ctx, 0, 0, 300, GOLD, 0.45);
          ctx.globalCompositeOperation = "source-over";
          // rangoli mandala at the centre
          ctx.strokeStyle = "#ffd98a";
          ctx.lineWidth = 1.4;
          alpha(ctx, 0.45 * (1 - dig));
          for (var j = 0; j < 3; j++) {
            ctx.beginPath();
            ctx.arc(0, 0, 34 + j * 26, 0, TAU);
            ctx.stroke();
          }
          for (var p = 0; p < 12; p++) {
            var pa = (p / 12) * TAU + t * 0.1;
            ctx.beginPath();
            ctx.ellipse(Math.cos(pa) * 70, Math.sin(pa) * 70, 18, 7, pa, 0, TAU);
            ctx.stroke();
          }
          // festoon light spokes
          ctx.globalCompositeOperation = "lighter";
          for (var s = 0; s < 18; s++) {
            var sa = (s / 18) * TAU;
            for (var d = 540; d < 1500; d += 36) {
              var tw = hash(s * 97 + d, Math.floor(t * 6));
              glow(ctx, Math.cos(sa) * d, Math.sin(sa) * d, 11, (s + d / 36) % 3 ? WARM : CRIM, 0.45 + 0.4 * tw);
            }
          }
          ctx.globalCompositeOperation = "source-over";
          // spectators
          ctx.fillStyle = "#1a0a0c";
          for (var q = 0; q < 360; q++) {
            var qa = hash(q, 11) * TAU;
            var qr = 545 + hash(q, 12) * 150;
            alpha(ctx, 0.8);
            ctx.beginPath();
            ctx.arc(Math.cos(qa) * qr, Math.sin(qa) * qr, 5 + hash(q, 13) * 2, 0, TAU);
            ctx.fill();
          }
          // dancers
          var id = 0;
          for (var ri = 0; ri < RINGS1.length; ri++) {
            var R = RINGS1[ri];
            var n = Math.round((TAU * R) / 44);
            var dir = ri % 2 ? -1 : 1;
            var w = 0.34 * dir;
            var fade = 1 - dig * (ri === 0 ? 0.9 : 0.7);
            for (var m = 0; m < n; m++) {
              var a = (m / n) * TAU + t * w + ri * 0.4;
              dancerTop(ctx, Math.cos(a) * R, Math.sin(a) * R, a + Math.PI / 2, t, id++, fade);
            }
          }
          // the Garba circle resolves into a digital ring
          if (dig > 0) {
            var R0 = RINGS1[0];
            ctx.globalCompositeOperation = "lighter";
            alpha(ctx, dig);
            ctx.strokeStyle = "#ffd98a";
            ctx.lineWidth = 3 / k + 1;
            ctx.beginPath();
            ctx.arc(0, 0, R0, 0, TAU);
            ctx.stroke();
            alpha(ctx, dig * 0.6);
            ctx.strokeStyle = "#5cc8ff";
            ctx.lineWidth = 1.2;
            ctx.setLineDash([6, 8]);
            ctx.beginPath();
            ctx.arc(0, 0, R0 + 16, t * 0.4, t * 0.4 + TAU);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalCompositeOperation = "source-over";
            ctx.restore();
            ctx.save();
            // nodes begin to emerge in screen space so they align with Scene 2
            nine(ctx, 540, 1010, 340, 340, 0, function () {
              return 0;
            }, 26 * dig, t);
          }
          ctx.restore();
        }

        // ================= SCENE 2: nine nodes =================
        var NODE_T = [];
        for (var ni = 0; ni < 9; ni++) NODE_T.push(3.25 + ni * 0.17);
        function nodeOn(i, t) {
          return smooth(NODE_T[i], NODE_T[i] + 0.12, t);
        }
        function s2scale(t) {
          var x = clamp((t - 3) / 3, 0, 1);
          return 1 + 0.18 * (0.5 - 0.5 * Math.cos(Math.PI * x));
        }
        function drawS2(ctx, t) {
          var g = s2scale(t);
          var cx = 540,
            cy = 1010,
            R = 340 * g;
          var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 1150);
          bg.addColorStop(0, "#2c0712");
          bg.addColorStop(0.5, "#120409");
          bg.addColorStop(1, "#040103");
          alpha(ctx, 1);
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, 1080, 1920);
          var all = smooth(4.8, 4.9, t) * (0.6 + 0.4 * Math.exp(-(t - 4.9) * 2.5));
          ctx.globalCompositeOperation = "lighter";
          glow(ctx, cx, cy, 620 * g, CRIM, 0.35);
          glow(ctx, cx, cy, 420 * g, GOLD, 0.12 + 0.25 * all);
          // parallax tech rings
          var layers = [
            { r: 0.5, p: 1.35, c: "#5cc8ff", a: 0.35, dash: [3, 9], sp: 0.5 },
            { r: 0.76, p: 1.2, c: "#ffd98a", a: 0.25, dash: [26, 10], sp: -0.3 },
            { r: 1.26, p: 0.85, c: "#5cc8ff", a: 0.22, dash: [2, 14], sp: 0.18 },
            { r: 1.55, p: 0.7, c: "#ffd98a", a: 0.12, dash: [], sp: 0 },
          ];
          for (var L = 0; L < layers.length; L++) {
            var ly = layers[L];
            var rr = 340 * ly.r * Math.pow(g, ly.p);
            alpha(ctx, ly.a);
            ctx.strokeStyle = ly.c;
            ctx.lineWidth = 1.5;
            ctx.setLineDash(ly.dash);
            ctx.beginPath();
            ctx.arc(cx, cy, rr, t * ly.sp, t * ly.sp + TAU);
            ctx.stroke();
          }
          ctx.setLineDash([]);
          // tick marks
          alpha(ctx, 0.3);
          ctx.strokeStyle = "#ffd98a";
          ctx.lineWidth = 1.2;
          var tr = 340 * 1.12 * Math.pow(g, 0.95);
          for (var tk = 0; tk < 72; tk++) {
            var ta = (tk / 72) * TAU - t * 0.08;
            var l1 = tk % 8 === 0 ? 14 : 6;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ta) * tr, cy + Math.sin(ta) * tr);
            ctx.lineTo(cx + Math.cos(ta) * (tr + l1), cy + Math.sin(ta) * (tr + l1));
            ctx.stroke();
          }
          // arcs connecting nodes + spokes
          for (var i = 0; i < 9; i++) {
            var on = nodeOn(i, t);
            var a0 = -Math.PI / 2 + (i * TAU) / 9;
            var a1 = a0 + TAU / 9;
            var nextOn = i < 8 ? nodeOn(i + 1, t) : smooth(4.75, 4.85, t);
            if (nextOn > 0) {
              alpha(ctx, 0.9);
              ctx.strokeStyle = "#ffcf6e";
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(cx, cy, R, a0, a0 + (a1 - a0) * nextOn);
              ctx.stroke();
            }
            alpha(ctx, 0.12 + 0.35 * on);
            ctx.strokeStyle = "#5cc8ff";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a0) * R * 0.32, cy + Math.sin(a0) * R * 0.32);
            ctx.lineTo(cx + Math.cos(a0) * R * 0.66, cy + Math.sin(a0) * R * 0.66);
            ctx.stroke();
            alpha(ctx, 0.4 * on);
            ctx.fillStyle = "#5cc8ff";
            ctx.fillRect(cx + Math.cos(a0) * R * 0.32 - 3, cy + Math.sin(a0) * R * 0.32 - 3, 6, 6);
          }
          // node rings
          for (var j = 0; j < 9; j++) {
            var o = nodeOn(j, t);
            var aj = -Math.PI / 2 + (j * TAU) / 9;
            var x = cx + Math.cos(aj) * R,
              y = cy + Math.sin(aj) * R;
            var pop = Math.exp(-Math.max(0, t - NODE_T[j]) * 6) * o;
            glow(ctx, x, y, (95 + 70 * all + 60 * pop) * g, GOLD, 0.15 + 0.5 * o + 0.3 * all);
            glow(ctx, x, y, 32 * g, WARM, o);
            ctx.globalCompositeOperation = "source-over";
            alpha(ctx, 0.5 + 0.5 * o);
            ctx.strokeStyle = o > 0.3 ? "#ffe3a1" : "#9a7038";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x, y, (26 + 6 * pop) * g, 0, TAU);
            ctx.stroke();
            alpha(ctx, 0.35 * o);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y, (38 + 30 * pop) * g, 0, TAU);
            ctx.stroke();
            alpha(ctx, o);
            ctx.fillStyle = "#fff6dc";
            ctx.beginPath();
            ctx.arc(x, y, 11 * g, 0, TAU);
            ctx.fill();
            ctx.globalCompositeOperation = "lighter";
          }
          ctx.globalCompositeOperation = "source-over";
        }

        // ================= SCENE 3: prize halo =================
        function drawS3(ctx, t) {
          var cx = 540,
            cy = 1010;
          var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 1200);
          bg.addColorStop(0, "#4c0c19");
          bg.addColorStop(0.45, "#1c050a");
          bg.addColorStop(1, "#050103");
          alpha(ctx, 1);
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.globalCompositeOperation = "lighter";
          // soft rays
          for (var r = 0; r < 24; r++) {

          c1.setAttribute("r", 9);
          c1.setAttribute("fill", "#f5b84a");
          c1.setAttribute("filter", "url(#wdot)");
          dots.appendChild(c1);
          var c2 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c2.setAttribute("cx", 200 + Math.cos(da) * 104);
          c2.setAttribute("cy", 405 + Math.sin(da) * 104);
          c2.setAttribute("r", 5);
          c2.setAttribute("fill", "#fff3cf");
          dots.appendChild(c2);
        }

        // ---------- timeline ----------
        var tl = gsap.timeline({ paused: true });
        var proxy = { t: 0 };
        tl.to(proxy, {
          t: 20,
          duration: 20,
          ease: "none",
          onUpdate: function () {
            draw(proxy.t);
          },
        }, 0);

        function textIn(sel, at) {
          tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, at);
        }
        function frameOut(sel, at) {
          tl.to(sel, { opacity: 0, scale: 1.14, filter: "blur(10px)", duration: 0.22, ease: "power2.in", transformOrigin: "50% 50%" }, at);
        }
        function flash(at, peak, hold) {
          tl.fromTo("#flash", { opacity: 0 }, { opacity: peak, duration: 0.14, ease: "power2.in", immediateRender: false }, at);
          tl.to("#flash", { opacity: 0, duration: hold || 0.35, ease: "power2.out" }, at + 0.14);
        }

        // Scene 1
        textIn("#t1-a", 0.35);
        textIn("#t1-b", 0.7);
        frameOut("#t1-frame", 2.88);
        flash(2.92, 0.75, 0.3);

        // Scene 2
        textIn("#t2-a", 3.3);
        textIn("#t2-b", 4.05);
        tl.fromTo("#t2-labels", { scale: 1, transformOrigin: "540px 1010px" }, { scale: 1.18, duration: 3, ease: "sine.inOut" }, 3);
        for (var lj = 0; lj < 9; lj++) {
          tl.fromTo("#t2-l" + lj, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 3.25 + lj * 0.17);
        }
        tl.fromTo("#t2-shield", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 4.85);
        frameOut("#t2-frame", 5.86);
        tl.to("#t2-labels", { opacity: 0, duration: 0.2 }, 5.86);
        tl.to("#t2-shield", { opacity: 0, duration: 0.2 }, 5.86);
        flash(5.86, 0.85, 0.32);

        // Scene 3
        textIn("#t3-a", 6.15);
        tl.fromTo("#o3-left", { x: -720, rotationY: 35, transformPerspective: 1400 }, { x: 0, rotationY: 0, duration: 0.75, ease: "expo.out" }, 6.6);
        tl.fromTo("#o3-right", { x: 720, rotationY: -35, transformPerspective: 1400 }, { x: 0, rotationY: 0, duration: 0.75, ease: "expo.out" }, 6.6);
        // subtle orbit around both cards
        tl.fromTo("#o3-frame", { rotationY: -7, scale: 0.98, transformPerspective: 1800, transformOrigin: "540px 1010px" }, { rotationY: 7, scale: 1.04, duration: 2.9, ease: "sine.inOut" }, 6.6);
        tl.fromTo("#o3-sheenL", { x: 0 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 7.55);
        tl.fromTo("#o3-glowL", { opacity: 0 }, { opacity: 0.9, duration: 0.25 }, 7.6);
        tl.to("#o3-glowL", { opacity: 0.35, duration: 0.4 }, 7.9);
        tl.fromTo("#o3-sheenR", { x: 0 }, { x: 760, duration: 0.6, ease: "power2.inOut" }, 8.05);
        tl.fromTo("#o3-glowR", { opacity: 0 }, { opacity: 0.9, duration: 0.2 }, 8.1);
        tl.to("#o3-glowR", { opacity: 0.35, duration: 0.2 }, 8.35);
        tl.to(["#o3-glowL", "#o3-glowR"], { opacity: 1, duration: 0.3 }, 8.65);
        tl.to("#o3 .card", { borderColor: "rgba(255,236,190,1)", duration: 0.3 }, 8.65);
        // merge into light
        tl.to("#o3-left", { x: 240, scale: 0.35, opacity: 0, duration: 0.45, ease: "power3.in" }, 9.45);
        tl.to("#o3-right", { x: -240, scale: 0.35, opacity: 0, duration: 0.45, ease: "power3.in" }, 9.45);
        frameOut("#t3-frame", 9.72);
        flash(9.8, 1, 0.4);

        // Scene 4
        tl.fromTo("#o4-giftwrap", { opacity: 0, y: 40, scale: 0.9, transformOrigin: "50% 60%" }, { opacity: 1, y: 0, scale: 0.94, duration: 0.7, ease: "power3.out" }, 10.25);
        tl.to("#o4-giftwrap", { scale: 1.06, duration: 2.9, ease: "sine.inOut" }, 10.95);
        textIn("#t4-a", 10.45);
        textIn("#t4-b", 10.95);
        tl.fromTo("#o4-sheen", { x: 0 }, { x: 260, duration: 0.7, ease: "power2.inOut" }, 11.75);
        tl.fromTo("#o4-glow", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 3.4, duration: 0.75, ease: "power2.in" }, 13.3);
        frameOut("#t4-frame", 13.82);
        flash(13.88, 1, 0.38);

        // Scene 5
        tl.fromTo("#o5-watchwrap", { scale: 2.9, transformOrigin: "200px 405px" }, { scale: 1, duration: 1.45, ease: "expo.out" }, 14.05);
        tl.fromTo("#o5-spin", { rotationY: -22, transformPerspective: 1600 }, { rotationY: 14, duration: 3, ease: "sine.inOut" }, 14.05);
        tl.fromTo("#o5-sheen", { x: 0 }, { x: 470, duration: 0.9, ease: "power2.inOut" }, 15.15);
        tl.fromTo("#o5-sheen", { x: 0 }, { x: 470, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 16.1);
        textIn("#t5-a", 14.35);
        textIn("#t5-b", 15.5);
        frameOut("#t5-frame", 16.8);
        tl.to("#o5-frame", { opacity: 0, scale: 1.08, duration: 0.25, ease: "power2.in", transformOrigin: "540px 940px" }, 16.82);
        flash(16.9, 0.9, 0.3);

        // Scene 6
        tl.fromTo("#t6a-a", { opacity: 0, scale: 1.25, filter: "blur(10px)", transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 17.15);
        frameOut("#t6a-frame", 17.84);
        flash(17.92, 0.7, 0.25);
        tl.fromTo("#t6b-frame", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 18.05);
        flash(19.18, 0.45, 0.35);
        // clean cut to black; T&C remains
        tl.set("#blackout", { opacity: 1 }, 19.6);

        draw(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
