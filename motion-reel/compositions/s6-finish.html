      // 0.00-0.52 · convergence: every frame takes its own path to the centre, slowing as it arrives.
      const durs = [0.48, 0.42, 0.52, 0.38, 0.45, 0.5, 0.46];
      const xe = ["power2.out", "power3.out", "power1.out", "power3.out", "power2.out", "power4.out", "power2.out"];

      L.forEach((_, i) => {
        const bx = 188 + i * 224 + 100;
        const f = `#s6-f${i}`;
        tl.to(f, { x: 960 - bx, duration: durs[i], ease: xe[i] }, 0.02 * i);
        tl.to(f, { y: 540 - 800, duration: durs[i], ease: ye[i] }, 0.02 * i);
        tl.to(f, { scale: 0.06, rotation: (i % 2 ? 1 : -1) * 8, duration: durs[i], ease: "power2.in" }, 0.02 * i);

      });

      // the period is the square everything converged into; it waits at the centre
      const period = document.querySelector("#s6-period");
      const invite = document.querySelector("#s6-invite");

      tl.fromTo("#s6-door-r", { rotationY: 0, transformOrigin: "100% 50%" }, { rotationY: 100, duration: 0.42, ease: "power2.inOut" }, 0.42);
