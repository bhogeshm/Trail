  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const CX = 560;
      const CY = 540;
      // h: slit length, w: half-opening (the lens bulges to 0.75 w at its middle)
      const slit = { h: 0, w: 0, emL: 150, emR: -150 };

      function lens(h, w) {
        const t = CY - h / 2;
        const b = CY + h / 2;
        const k1 = CY - h * 0.2;
        const k2 = CY + h * 0.2;
        return `M${CX},${t} C${CX - w},${k1} ${CX - w},${k2} ${CX},${b} C${CX + w},${k2} ${CX + w},${k1} ${CX},${t} Z`;
      }
      function draw() {
        const d = slit.h > 0.5 ? lens(slit.h, slit.w) : "";
        document.getElementById("s1-slit").setAttribute("d", d);
        document.getElementById("s1-lip-light").setAttribute("d", d);
        document.getElementById("s1-lip-shadow").setAttribute("d", d);
        const half = slit.w * 0.75;
        document.getElementById("s1-clip-l-r").setAttribute("width", CX + half);
        document.getElementById("s1-clip-r-r").setAttribute("x", CX - half);
        document.getElementById("s1-hand-l").setAttribute("transform", `translate(${CX - half + slit.emL} 0)`);
        document.getElementById("s1-hand-r").setAttribute("transform", `translate(${CX + half + slit.emR} 0)`);
      }
      draw();

      // 0.00-0.70 · the surface. A pressure dimple swells: something is behind it.
      tl.fromTo("#s1-bulge", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.inOut" }, 0.2);

      // 0.70 · the cut: a hairline runs top to bottom in 3 frames.
      tl.to(slit, { h: 560, w: 2, duration: 0.12, ease: "power4.out", onUpdate: draw }, 0.7);
      // 0.84-1.20 · fingers press through the hairline; the paper gives a little.
      tl.to(slit, { w: 12, duration: 0.3, ease: "power2.out", onUpdate: draw }, 0.84);
      tl.to(slit, { emL: 0, duration: 0.36, ease: "power3.out", onUpdate: draw }, 0.86);
      tl.to(slit, { emR: 0, duration: 0.36, ease: "power3.out", onUpdate: draw }, 0.9);
      // 1.20-2.04 · the pull, with stick-slip: open, resist, give way, settle.
      tl.to(slit, { w: 46, duration: 0.24, ease: "power2.out", onUpdate: draw }, 1.2);
      tl.to(slit, { w: 49, duration: 0.12, ease: "none", onUpdate: draw }, 1.44);
      tl.to(slit, { w: 172, duration: 0.4, ease: "power3.inOut", onUpdate: draw }, 1.56);
      tl.to(slit, { w: 166, duration: 0.12, ease: "power2.out", onUpdate: draw }, 1.96);
      tl.to("#s1-bulge", { scaleX: 1.22, duration: 0.8, ease: "power3.inOut" }, 1.2);

      // 2.00 · freeze. WHAT IS. lands once: 112% -> 98.5% -> 100% inside 7 frames.
      tl.fromTo("#s1-title", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.12, ease: "expo.out" }, 2.0);
      tl.fromTo("#s1-title", { scale: 1.12, transformOrigin: "0% 50%" }, { scale: 0.985, duration: 0.12, ease: "power4.out" }, 2.0);
      tl.to("#s1-title", { scale: 1, duration: 0.16, ease: "power2.out" }, 2.12);
      // 2.36 · the quiet line arrives above it, word by word, no movement.
      tl.fromTo("#s1-kicker span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, stagger: 0.07, ease: "power2.out" }, 2.36);

      // 3.34-4.00 · exit into 02: fingers slide back into the dark, the cut closes to a ruled line,
      // and the camera pushes into it until it sits on the centre axis.
      tl.to("#s1-kicker span", { opacity: 0, filter: "blur(6px)", duration: 0.14, stagger: 0.04, ease: "power2.in" }, 3.3);
      tl.to("#s1-title", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 3.38);
      tl.to(slit, { emL: 150, emR: -150, duration: 0.24, ease: "power2.in", onUpdate: draw }, 3.34);
      tl.to(slit, { w: 2, duration: 0.36, ease: "power3.inOut", onUpdate: draw }, 3.46);
      tl.to("#s1-bulge", { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);
      tl.set("#s1-line", { opacity: 1 }, 3.82);
      tl.set("#s1-slit, #s1-lip-light, #s1-lip-shadow", { opacity: 0 }, 3.82);
      tl.fromTo(
        "#s1-cam",
        { scale: 1, x: 0, transformOrigin: "560px 540px" },
        { scale: 1.35, x: 400, duration: 0.62, ease: "power3.in" },
        3.38,
      );

      window.__timelines["s1-hook"] = tl;
    })();
