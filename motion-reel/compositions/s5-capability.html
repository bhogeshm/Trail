        tl.fromTo(`#s5-v${i}`, { x: 0, y: 0, scale: 0.3, opacity: 0 }, { x, y, scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.3 + i * 0.03);

      tl.set("#s5-select", { opacity: 1, x: pos[1][0], y: pos[1][1] }, 0.54);
      tl.set("#s5-select", { x: pos[4][0], y: pos[4][1] }, 0.6);

        tl.to(`#s5-v${i}`, { x: 0, y: 0, scale: 0, duration: 0.16, ease: "power3.in" }, 0.74 + (i % 3) * 0.015);

      tl.set("#s5-v3", { opacity: 0 }, 0.92);

      // ---- STORIES WITH PURPOSE. · the cube flattens into a frame, the frame becomes a strip of

      roll("#s5-say2", "#s5-say3", 1.8);
      tl.to("#s5-cube", { rotationX: 0, rotationY: 0, duration: 0.15, ease: "power3.in" }, 1.8);
