<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Employees</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <div>
          <h1>AI Employees</h1>
          <p>Your always-on marketing team</p>
        </div>
      </div>
      <nav id="team" class="team" aria-label="Team members"></nav>
      <p class="hint">Tip: brief <strong>Ava (CEO)</strong> and she will delegate work to the rest of the team.</p>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div id="current" class="current"></div>
        <button id="clear" class="ghost" type="button">New chat</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="Give your team a task…" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
