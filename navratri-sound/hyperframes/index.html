<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
      #film { object-fit: cover; transform-origin: 50% 50%; }
      /* soft cinematic vignette */
      #vignette {
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.38) 100%);
        pointer-events: none;
      }
      /* light flashes on the big musical hits */
      .flash { opacity: 0; mix-blend-mode: screen; pointer-events: none; }
      #flash-warm { background: radial-gradient(ellipse at center, #fff6e0 0%, #ffcf7a 55%, #ff9a3c 100%); }
      #flash-pink { background: radial-gradient(ellipse at 45% 40%, #ffd1ea 0%, #ff5fae 60%, rgba(255,60,150,0) 100%); }
      #flash-cool { background: radial-gradient(ellipse at 50% 55%, #ffffff 0%, #cfe6ff 50%, rgba(160,200,255,0) 100%); }
      /* 2.35:1 letterbox — also hides the burned-in camera HUD text in the source */
      .bar { position: absolute; left: 0; width: 100%; height: 540px; background: #000; inset: auto; }
      #bar-top { top: 0; }
      #bar-bot { top: auto; bottom: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="46.8" data-width="1920" data-height="1080">
      <video id="film" class="clip" src="assets/edit.mp4" muted playsinline
             data-start="0" data-duration="46.8" data-media-start="0" data-track-index="0"></video>
      <div id="vignette" class="clip" data-start="0" data-duration="46.8" data-track-index="1"></div>
      <div id="flash-warm" class="clip flash" data-start="0" data-duration="46.8" data-track-index="2"></div>
      <div id="flash-pink" class="clip flash" data-start="0" data-duration="46.8" data-track-index="3"></div>
      <div id="flash-cool" class="clip flash" data-start="0" data-duration="46.8" data-track-index="4"></div>
      <div id="bar-top" class="clip bar" data-start="0" data-duration="46.8" data-track-index="5"></div>
      <div id="bar-bot" class="clip bar" data-start="0" data-duration="46.8" data-track-index="6"></div>
      <audio id="score" src="assets/mix.wav" data-start="0" data-duration="46.8" data-volume="1" data-track-index="7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false, overwrite: "auto" } });
      tl.set("#film", { scale: 1 }, 0);
      tl.set(".flash", { opacity: 0 }, 0);

      // Opening: letterbox curtain parts to reveal the frame; closes again at the end.
      tl.fromTo("#bar-top", { y: 0 }, { y: -408, duration: 1.1, ease: "power3.inOut" }, 0);
      tl.fromTo("#bar-bot", { y: 0 }, { y: 408, duration: 1.1, ease: "power3.inOut" }, 0);
      tl.to("#bar-top", { y: 0, duration: 1.4, ease: "power2.inOut" }, 45.4);
      tl.to("#bar-bot", { y: 0, duration: 1.4, ease: "power2.inOut" }, 45.4);

      // Big hits: light burst + punch-in (dhol drop, aerial reveal, fleet finale)
      [[11.6, 0.8], [28.1, 0.9], [42.6, 0.85]].forEach(([t, a]) => {
        tl.fromTo("#flash-warm", { opacity: a }, { opacity: 0, duration: 0.45, ease: "power2.out" }, t);
        tl.fromTo("#film", { scale: 1.06 }, { scale: 1.0, duration: 0.7, ease: "expo.out" }, t);
      });
      // Headlight snap on the Gurkha, and the tap-tap-THUMP basket landing
      tl.fromTo("#flash-cool", { opacity: 0.55 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 23.1);
      tl.fromTo("#film", { scale: 1.035 }, { scale: 1.0, duration: 0.35, ease: "expo.out" }, 2.0);
      // Dandiya hero clack
      tl.fromTo("#flash-warm", { opacity: 0.35 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 16.07);
      // Gulal colour burst
      tl.fromTo("#flash-pink", { opacity: 0.45 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 36.87);

      // Groove pulses: a subtle breathe on the downbeats of the second drop
      for (let t = 29.6; t < 40.6; t += 2.0) {
        tl.fromTo("#film", { scale: 1.018 }, { scale: 1.0, duration: 0.45, ease: "power2.out" }, t);
      }
      tl.set({}, {}, 46.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
