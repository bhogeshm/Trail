      <div id="s5-root" data-composition-id="s5-backup" data-width="1920" data-height="1080">

        <div id="s5-card1" class="s5-card">
          <div class="s5-av" style="background:#e3f1e4;color:#2f6b43">R</div>

          <div>
            <div class="s5-name">GreenLoop Collectors <span style="font-size:36px;color:#2f6b43">★ 4.7</span></div>

        <div id="s5-ring"></div>
        <div class="s5-spark"></div><div class="s5-spark"></div><div class="s5-spark"></div><div class="s5-spark"></div>

      <script>
        (function () {
          window.wwIcons(document.getElementById("s5-root"));
          const tl = gsap.timeline({ paused: true });
          const S = "#s5-root ";

          tl.set(S + "#s5-pU", { opacity: 0 }, 0);
          tl.set(S + "#s5-bl2", { yPercent: 110 }, 0);

          // hard cut: the collector you rely on
          tl.fromTo(S + "#s5-card1", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0);
          tl.fromTo(S + "#s5-flash", { opacity: 0.45 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);

          // … goes dark
          tl.to(S + "#s5-pA", { opacity: 0, duration: 0.06 }, 0.22);
          tl.fromTo(S + "#s5-pU", { scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, 0.22);
          tl.to(S + "#s5-card1", { boxShadow: "0 0 0 5px #ff4a3d, 0 0 90px rgba(255,74,61,0.45)", duration: 0.15 }, 0.22);
          tl.to(S + "#s5-card1", { keyframes: [
            { x: -22, duration: 0.04 }, { x: 18, duration: 0.04 }, { x: -12, duration: 0.04 }, { x: 8, duration: 0.04 }, { x: 0, duration: 0.05 },
          ] }, 0.25);
          tl.fromTo(S + "#s5-b1", { opacity: 0, scale: 1.7, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out" }, 0.3);
          tl.fromTo(S + "#s5-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 0.45);
          tl.fromTo(S + "#s5-redv", { opacity: 0 }, { keyframes: [
            { opacity: 1, duration: 0.12 }, { opacity: 0.3, duration: 0.25 }, { opacity: 1, duration: 0.12 }, { opacity: 0.35, duration: 0.3 },
          ] }, 0.3);
          tl.to(S + "#s5-b1 .s5-bic", { keyframes: [{ scale: 1.15, duration: 0.12 }, { scale: 1, duration: 0.2 }, { scale: 1.15, duration: 0.12 }, { scale: 1, duration: 0.2 }] }, 0.4);

          // whip to the backup
          tl.to(S + "#s5-card1", { x: -1600, filter: "blur(20px)", duration: 0.28, ease: "expo.in" }, 1.3);
          tl.to(S + "#s5-b1", { y: -220, opacity: 0, duration: 0.25, ease: "expo.in" }, 1.3);
          tl.to(S + "#s5-redv", { opacity: 0, duration: 0.25 }, 1.35);
          tl.fromTo(S + "#s5-card2", { x: 1600, filter: "blur(20px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 1.5);
          tl.to(S + "#s5-card2", { boxShadow: "0 0 0 5px #3ddc84, 0 0 90px rgba(61,220,132,0.35)", duration: 0.25 }, 1.7);
          tl.fromTo(S + "#s5-greenv", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.55);
          tl.fromTo(S + "#s5-b2", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.62);
          tl.fromTo(S + "#s5-b2 .s5-bic", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(3)" }, 1.85);
          tl.fromTo(S + "#s5-pG", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 1.8);

          // CONFIRM
          tl.fromTo(S + "#s5-btn", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.3);
          tl.to(S + "#s5-btn", { scale: 0.93, duration: 0.08, ease: "power2.out" }, 2.78);
          tl.to(S + "#s5-btn", { scale: 1, backgroundColor: "#2f8f52", duration: 0.3, ease: "back.out(3)" }, 2.86);
          tl.to(S + "#s5-bl1", { yPercent: -110, duration: 0.28, ease: "expo.inOut" }, 2.85);
          tl.to(S + "#s5-bl2", { yPercent: 0, duration: 0.28, ease: "expo.inOut" }, 2.85);
          tl.fromTo(S + "#s5-ring", { opacity: 1, scale: 0.4 }, { immediateRender: false, opacity: 0, scale: 6, duration: 0.7, ease: "power2.out" }, 2.85);
          gsap.utils.toArray(S + ".s5-spark").forEach(function (el, i) {
            const a = (i / 8) * Math.PI * 2;
            tl.fromTo(el, { opacity: 1, x: 0, y: 0, scale: 1 },
              { immediateRender: false, opacity: 0, x: Math.cos(a) * 420, y: Math.sin(a) * 200, scale: 0.4, duration: 0.6, ease: "power3.out" }, 2.88);
          });

          // clear the stage for the pipeline
          tl.to([S + "#s5-card2", S + "#s5-b2", S + "#s5-btn"], { opacity: 0, scale: 0.9, duration: 0.35, ease: "power3.in", stagger: 0.04 }, 3.6);
          tl.to(S + "#s5-greenv", { opacity: 0, duration: 0.35 }, 3.6);

          window.__timelines["s5-backup"] = tl;
        })();
