        #s1-stage {

        }
        #s1-bag {

        #s1-shadow {

          background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0) 70%);

        .s1-ghost {

        #s1-flash {
          position: absolute;
          inset: 0;
          background: #fff;
          opacity: 0;
        }
      </style>

      <div id="s1-root" data-composition-id="s1-problem" data-width="1920" data-height="1080">
        <div id="s1-spot"></div>
        <div id="s1-stage">
          <div id="s1-shadow"></div>
          <div id="s1-bagwrap">
            <div id="s1-bag">
              <svg viewBox="0 0 400 440">
                <defs>
                  <radialGradient id="s1-bagfill" cx="40%" cy="35%" r="75%">
                    <stop offset="0" stop-color="#3a423c" />
                    <stop offset="0.55" stop-color="#1c211d" />

                </defs>
                <path d="M172 92 C140 66 128 30 150 20 C172 14 186 50 197 86 Z" fill="#2b312d" />
                <path d="M228 92 C260 66 274 28 252 20 C230 14 214 50 203 86 Z" fill="#2b312d" />
                <path d="M182 112 L172 84 L228 84 L218 112 Z" fill="#262b27" />
                <path d="M200 108 C118 104 58 156 50 246 C42 334 80 410 150 428 C185 437 220 437 255 428 C325 410 362 334 352 246 C344 156 282 104 200 108 Z"
                  fill="url(#s1-bagfill)" stroke="#4b544d" stroke-width="2" />
                <path d="M122 190 C106 250 112 330 140 392" stroke="rgba(255,255,255,0.09)" stroke-width="7" fill="none" stroke-linecap="round" />
                <path d="M268 180 C292 246 296 318 272 384" stroke="rgba(255,255,255,0.06)" stroke-width="7" fill="none" stroke-linecap="round" />
                <path d="M196 150 C186 220 190 300 206 370" stroke="rgba(255,255,255,0.05)" stroke-width="5" fill="none" stroke-linecap="round" />
                <ellipse cx="150" cy="200" rx="34" ry="58" fill="rgba(255,255,255,0.07)" />
              </svg>
            </div>
          </div>

          <div id="s1-w1g1" class="s1-word s1-ghost" style="left:120px;top:150px;font-size:150px;color:#ff3b2f">NO COLLECTOR</div>
          <div id="s1-w1g2" class="s1-word s1-ghost" style="left:120px;top:150px;font-size:150px;color:#3ddc84">NO COLLECTOR</div>
          <div id="s1-w2g1" class="s1-word s1-ghost" style="left:230px;top:420px;font-size:140px;color:#f4f5f2">NO CLEAR DISPOSAL</div>
          <div id="s1-w3g1" class="s1-word s1-ghost" style="left:760px;top:700px;font-size:176px;color:#ff3b2f">NO BACKUP</div>

          <div id="s1-w1" class="s1-word" data-layout-allow-overlap>NO COLLECTOR</div>
          <div id="s1-w2" class="s1-word" data-layout-allow-overlap>NO CLEAR DISPOSAL</div>
          <div id="s1-w3" class="s1-word" data-layout-allow-overlap>NO BACKUP</div>

          <div id="s1-c1" class="s1-chip red" style="left:1380px;top:110px">MISSED PICKUP · DAY 3</div>
          <div id="s1-c2" class="s1-chip" style="left:150px;top:640px">BIN OVERFLOWING</div>
          <div id="s1-c3" class="s1-chip" style="left:1300px;top:590px">WHERE DOES THIS GO?</div>
          <div id="s1-c4" class="s1-chip red" style="left:240px;top:930px">E-WASTE??</div>
          <div id="s1-c5" class="s1-chip" style="left:1460px;top:960px">SEGREGATE HOW?</div>
          <div id="s1-c6" class="s1-chip" style="left:860px;top:340px">WHO DO I CALL?</div>
        </div>
        <div id="s1-flash"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const S = "#s1-root ";

          // slow camera push across the whole beat
          tl.fromTo(S + "#s1-stage", { scale: 1 }, { scale: 1.08, duration: 4, ease: "none" }, 0);
          tl.fromTo(S + "#s1-spot", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);

          // bag drop: fall, squash, settle
          tl.fromTo(S + "#s1-bagwrap", { y: -1100, rotation: -8 }, { y: 0, rotation: 0, duration: 0.42, ease: "power3.in" }, 0.13);
          tl.fromTo(S + "#s1-shadow", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power3.in" }, 0.13);
          tl.to(S + "#s1-bag", { scaleY: 0.78, scaleX: 1.16, duration: 0.07, ease: "power2.out" }, 0.55);
          tl.to(S + "#s1-bag", { scaleY: 1.06, scaleX: 0.95, duration: 0.14, ease: "power2.out" }, 0.62);
          tl.to(S + "#s1-bag", { scaleY: 1, scaleX: 1, duration: 0.22, ease: "power2.inOut" }, 0.76);
          tl.to(S + "#s1-bag", { opacity: 0.35, duration: 0.3 }, 1.0);

          // word slams on the beat
          const slams = [
            ["#s1-w1", 1.0, -5],
            ["#s1-w2", 1.5, 3],
            ["#s1-w3", 2.0, -3],
          ];
          slams.forEach(function (s) {
            tl.fromTo(S + s[0], { opacity: 0, scale: 2.4, rotation: s[2] * 3, filter: "blur(18px)" },
              { opacity: 1, scale: 1, rotation: s[2], filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, s[1]);
            tl.fromTo(S + "#s1-stage", { x: 0, y: 0 },
              { keyframes: [{ x: -18, y: 10, duration: 0.04 }, { x: 14, y: -8, duration: 0.04 }, { x: -6, y: 4, duration: 0.04 }, { x: 0, y: 0, duration: 0.05 }] }, s[1] + 0.12);
          });
          tl.set(S + "#s1-w1g1", { rotation: -5 }, 0);
          tl.set(S + "#s1-w1g2", { rotation: -5 }, 0);
          tl.set(S + "#s1-w2g1", { rotation: 3 }, 0);
          tl.set(S + "#s1-w3g1", { rotation: -3 }, 0);

          // chaos: chips pop, RGB ghosts flicker, everything jitters
          ["#s1-c1", "#s1-c2", "#s1-c3", "#s1-c4", "#s1-c5", "#s1-c6"].forEach(function (id, i) {
            const rot = [6, -8, 4, -5, 9, -3][i];
            tl.fromTo(S + id, { opacity: 0, scale: 0.2, rotation: 0 },
              { opacity: 1, scale: 1, rotation: rot, duration: 0.16, ease: "back.out(3)" }, 2.5 + i * 0.12);
          });
          const jitter = [
            [-12, 6], [10, -9], [-7, 12], [14, 3], [-10, -7], [6, 10], [-14, -4], [9, 8], [-5, -11], [12, -6],
            [-9, 9], [7, -12], [-13, 5], [11, 7], [-6, -9], [13, 11], [-10, 4], [8, -8], [-12, 10], [6, -5],
          ];
          const kf = jitter.map(function (j) { return { x: j[0], y: j[1], duration: 0.06 }; });
          tl.to(S + "#s1-stage", { keyframes: kf.concat([{ x: 0, y: 0, duration: 0.04 }]) }, 2.55);
          const ghosts = [["#s1-w1g1", -16, 6], ["#s1-w1g2", 14, -6], ["#s1-w2g1", 18, 8], ["#s1-w3g1", -20, -6]];
          ghosts.forEach(function (g, i) {
            tl.fromTo(S + g[0], { opacity: 0, x: 0, y: 0 },
              { keyframes: [
                { opacity: 0.85, x: g[1], y: g[2], duration: 0.05 },
                { opacity: 0, duration: 0.07 },
                { opacity: 0.7, x: -g[1] * 0.6, y: g[2], duration: 0.05 },
                { opacity: 0.2, duration: 0.1 },
                { opacity: 0.9, x: g[1] * 1.4, y: -g[2], duration: 0.05 },
                { opacity: 0, x: 0, duration: 0.08 },
                { opacity: 0.6, x: g[1], duration: 0.05 },
                { opacity: 0, duration: 0.1 },
              ] }, 2.5 + i * 0.09);
          });
          tl.to([S + "#s1-w1", S + "#s1-w2", S + "#s1-w3"], { keyframes: [
            { skewX: -8, duration: 0.05 }, { skewX: 6, duration: 0.05 }, { skewX: 0, duration: 0.05 },
          ] }, 3.1);
          tl.to(S + "#s1-w2", { keyframes: [{ x: 30, duration: 0.04 }, { x: -24, duration: 0.04 }, { x: 0, duration: 0.04 }] }, 3.45);

          // pre-freeze flash on the downbeat
          tl.fromTo(S + "#s1-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "power2.in" }, 3.92);

          window.__timelines["s1-problem"] = tl;
        })();
      </script>
