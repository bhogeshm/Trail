      <script>
        (function () {
          window.wwIcons(document.getElementById("s4-root"));
          const tl = gsap.timeline({ paused: true });
          const S = "#s4-root ";

          // phone glides in, slowly squares up to camera
          tl.fromTo(S + "#s4-phone", { y: 900, rotationY: -28, rotationX: 10 },
            { y: 0, rotationY: -12, rotationX: 4, duration: 0.7, ease: "expo.out" }, 0);
          tl.to(S + "#s4-phone", { rotationY: -3, rotationX: 0, duration: 6.3, ease: "sine.inOut" }, 0.7);
          tl.set(S + "#s4-scrB", { xPercent: 100 }, 0);
          tl.set(S + "#s4-scrC", { xPercent: 100 }, 0);
          tl.set(S + "#s4-cl2", { yPercent: 100 }, 0);

          // tap the search bar and type
          const tap = S + "#s4-tap";
          function tapAt(x, y, t) {
            tl.set(tap, { x: x, y: y }, t - 0.01);
            tl.fromTo(tap, { opacity: 0.95, scale: 0.4 }, { immediateRender: false, opacity: 0, scale: 1.6, duration: 0.45, ease: "power2.out" }, t);
