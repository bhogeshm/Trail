<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #070908;
          font-family: "Space Grotesk", sans-serif;
          color: #f4f5f2;
        }
        #s6-grid {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(rgba(61, 220, 132, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(61, 220, 132, 0.05) 1px, transparent 1px);
          background-size: 80px 80px;
        }
        #s6-pipe {
          position: absolute;
          inset: 0;
        }
        #s6-kicker {
          position: absolute;
          left: 0;
          right: 0;
          top: 190px;
          text-align: center;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          font-weight: 500;
          letter-spacing: 0.3em;
          color: #8a968e;
        }
        .s6-node {
          position: absolute;
          top: 370px;
          width: 220px;
          height: 220px;
          border-radius: 44px;
          background: #101612;
          border: 2px solid #26332b;
          color: #3ddc84;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s6-node span {
          display: block;
          width: 96px;
          height: 96px;
        }
        #s6-n4 {
          background: #2f6b43;
          border-color: #3ddc84;
          color: #fff;
          box-shadow: 0 0 100px rgba(61, 220, 132, 0.45);
        }
        .s6-lab {
          position: absolute;
          top: 630px;
          width: 360px;
          text-align: center;
        }
        .s6-name {
          display: block;
          font-size: 50px;
          font-weight: 700;
          letter-spacing: -0.03em;
        }
        .s6-role {
          display: block;
          margin-top: 10px;
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.22em;
          color: #8a968e;
          text-transform: uppercase;
        }
        .s6-line {
          position: absolute;
          top: 478px;
          width: 200px;
          height: 4px;
          border-radius: 2px;
          background: #1f2a23;
          overflow: hidden;
        }
        .s6-fill {
          display: block;
          width: 100%;
          height: 100%;
          background: #3ddc84;
          transform-origin: 0 50%;
          box-shadow: 0 0 20px #3ddc84;
        }
        #s6-dot {
          position: absolute;
          left: 0;
          top: 470px;
          width: 20px;
          height: 20px;
          margin-left: -10px;
          border-radius: 50%;
          background: #b8ffd5;
          box-shadow: 0 0 24px 8px rgba(61, 220, 132, 0.8);
          opacity: 0;
        }
        .s6-flash {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .s6-ft {
          display: block;
          font-size: 176px;
          font-weight: 700;
          letter-spacing: -0.05em;
          line-height: 1;
          white-space: nowrap;
        }
        #s6-f1 {
          background: #f4f5f2;
          color: #131a15;
        }
        #s6-f2 {
          background: #2f6b43;
          color: #ffffff;
        }
        #s6-f3 {
          background: #050605;
          color: #3ddc84;
        }
        .s6-bit {
          position: absolute;
          left: 920px;
          top: 500px;
          width: 80px;
          height: 80px;
          border-radius: 24px;
          background: #2f6b43;
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .s6-bit span {
          display: block;
          width: 40px;
          height: 40px;
        }
        #s6-seed {
          position: absolute;
          left: 900px;
          top: 480px;
          width: 120px;
          height: 120px;
          border-radius: 50%;
          background: #2f6b43;
          box-shadow: 0 0 80px rgba(61, 220, 132, 0.7);
          opacity: 0;
        }
      </style>

      <div id="s6-root" data-composition-id="s6-pipeline" data-width="1920" data-height="1080">
        <div id="s6-grid"></div>
        <div id="s6-pipe">
          <div id="s6-kicker">HOW I BUILT IT · WITH AI</div>

          <div id="s6-l1" class="s6-line" style="left:440px"><i class="s6-fill"></i></div>
          <div id="s6-l2" class="s6-line" style="left:860px"><i class="s6-fill"></i></div>
          <div id="s6-l3" class="s6-line" style="left:1280px"><i class="s6-fill"></i></div>

          <div id="s6-n1" class="s6-node" style="left:220px"><span data-icon="chat" data-stroke="1.8"></span></div>
          <div id="s6-n2" class="s6-node" style="left:640px"><span data-icon="book" data-stroke="1.8"></span></div>
          <div id="s6-n3" class="s6-node" style="left:1060px"><span data-icon="layout" data-stroke="1.8"></span></div>
          <div id="s6-n4" class="s6-node" style="left:1480px"><span data-icon="recycle" data-stroke="2"></span></div>

          <div id="s6-t1" class="s6-lab" style="left:150px"><span class="s6-name">ChatGPT</span><span class="s6-role">Research</span></div>
          <div id="s6-t2" class="s6-lab" style="left:570px"><span class="s6-name">NotebookLM</span><span class="s6-role">Insights</span></div>
          <div id="s6-t3" class="s6-lab" style="left:990px"><span class="s6-name">Lovable</span><span class="s6-role">Prototype</span></div>
          <div id="s6-t4" class="s6-lab" style="left:1410px"><span class="s6-name" style="color:#3ddc84">WasteWise</span><span class="s6-role">Solution</span></div>
          <div id="s6-dot"></div>
        </div>

        <div id="s6-f1" class="s6-flash"><span class="s6-ft">LESS CONFUSION</span></div>
        <div id="s6-f2" class="s6-flash"><span class="s6-ft">MORE RELIABLE</span></div>
        <div id="s6-f3" class="s6-flash"><span class="s6-ft">MORE RECYCLING</span></div>

        <div class="s6-bit"><span data-icon="truck"></span></div>
        <div class="s6-bit"><span data-icon="wallet"></span></div>
        <div class="s6-bit"><span data-icon="pin"></span></div>
        <div class="s6-bit"><span data-icon="trash"></span></div>
        <div class="s6-bit"><span data-icon="check"></span></div>
        <div class="s6-bit"><span data-icon="search"></span></div>
        <div class="s6-bit"><span data-icon="bell"></span></div>
        <div class="s6-bit"><span data-icon="home"></span></div>
        <div id="s6-seed"></div>
      </div>

      <script>
        (function () {
          window.wwIcons(document.getElementById("s6-root"));
          const tl = gsap.timeline({ paused: true });
          const S = "#s6-root ";

          tl.fromTo(S + "#s6-kicker", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo(S + "#s6-pipe", { scale: 1.06 }, { scale: 1, duration: 2.2, ease: "power2.out" }, 0);

          // nodes light up in sequence; the signal travels the wire
          const at = [0.1, 0.6, 1.1, 1.6];
          [1, 2, 3, 4].forEach(function (n, i) {
            tl.fromTo(S + "#s6-n" + n, { opacity: 0, scale: 0.4, rotation: -12 },
              { opacity: 1, scale: 1, rotation: 0, duration: 0.38, ease: "back.out(2.2)" }, at[i]);
            tl.fromTo(S + "#s6-t" + n, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at[i] + 0.08);
            if (n < 4) {
              tl.fromTo(S + "#s6-l" + n + " .s6-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power2.inOut" }, at[i] + 0.24);
            }
          });
          tl.fromTo(S + "#s6-dot", { x: 330, opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.3);
          tl.to(S + "#s6-dot", { x: 750, duration: 0.3, ease: "power2.inOut" }, 0.34);
          tl.to(S + "#s6-dot", { x: 1170, duration: 0.3, ease: "power2.inOut" }, 0.84);
          tl.to(S + "#s6-dot", { x: 1590, duration: 0.3, ease: "power2.inOut" }, 1.34);
          tl.to(S + "#s6-dot", { opacity: 0, scale: 4, duration: 0.25 }, 1.64);
          tl.fromTo(S + "#s6-n4", { boxShadow: "0 0 0px rgba(61,220,132,0)" }, { boxShadow: "0 0 140px rgba(61,220,132,0.7)", duration: 0.4, ease: "power2.out" }, 1.65);
          tl.to(S + "#s6-pipe", { scale: 0.92, opacity: 0.6, duration: 0.3, ease: "power2.in" }, 2.0);

          // impact flashes on the beat
          const flashes = [["#s6-f1", 2.3], ["#s6-f2", 2.85], ["#s6-f3", 3.4]];
          flashes.forEach(function (f) {
            tl.set(S + f[0], { opacity: 1 }, f[1]);
            tl.fromTo(S + f[0] + " .s6-ft", { scale: 1.35, filter: "blur(12px)" }, { scale: 1, filter: "blur(0px)", duration: 0.22, ease: "power4.out" }, f[1]);
            tl.to(S + f[0] + " .s6-ft", { scale: 1.06, duration: 0.33, ease: "none" }, f[1] + 0.22);
          });

          // everything collapses into the seed of the logo
          tl.to(S + "#s6-f3 .s6-ft", { scaleX: 0.02, scaleY: 0.3, opacity: 0, duration: 0.25, ease: "expo.in" }, 3.6);
          const R = [[-820, -380], [760, -420], [-900, 300], [880, 360], [-120, -520], [140, 520], [-1000, -40], [1000, 40]];
          gsap.utils.toArray(S + ".s6-bit").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 1, x: R[i][0], y: R[i][1], rotation: i % 2 ? 40 : -40, scale: 1.2 },
              { immediateRender: false, x: 0, y: 0, rotation: 0, scale: 0.2, duration: 0.36, ease: "power3.in" }, 3.58 + i * 0.012);
            tl.set(el, { opacity: 0 }, 3.96);
          });
          tl.fromTo(S + "#s6-seed", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, 3.86);

          // hide layers fully covered by the opaque flash cards
          tl.set(S + "#s6-pipe", { autoAlpha: 0 }, 2.32);
          tl.set(S + "#s6-f1", { autoAlpha: 0 }, 2.87);
          tl.set(S + "#s6-f2", { autoAlpha: 0 }, 3.42);

          window.__timelines["s6-pipeline"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
