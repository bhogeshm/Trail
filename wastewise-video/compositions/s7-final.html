      <script>
        (function () {
          window.wwIcons(document.getElementById("s7-root"));
          const tl = gsap.timeline({ paused: true });
          const S = "#s7-root ";

          // impact: the seed blooms into the mark at frame centre
          tl.fromTo(S + "#s7-flash", { opacity: 0.7 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
          tl.fromTo(S + "#s7-mark", { x: 445, scale: 0.63 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0);
          tl.fromTo(S + "#s7-icon", { rotation: -240, scale: 0.2 }, { rotation: 0, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0);
          tl.fromTo(S + "#s7-r1", { x: 445, scale: 1, opacity: 1 }, { scale: 4.5, opacity: 0, duration: 1.0, ease: "power2.out" }, 0.02);
          tl.fromTo(S + "#s7-r2", { x: 445, scale: 1, opacity: 0.7 }, { scale: 7, opacity: 0, duration: 1.3, ease: "power2.out" }, 0.12);
          tl.fromTo(S + "#s7-stage", { scale: 1 }, { scale: 1.04, duration: 3, ease: "none" }, 0);

          // lockup
          tl.to(S + "#s7-mark", { x: 0, duration: 0.5, ease: "expo.inOut" }, 0.35);
          tl.to(S + "#s7-word", { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "expo.inOut" }, 0.45);
          tl.fromTo(S + "#s7-word", { x: -60 }, { x: 0, duration: 0.6, ease: "expo.out" }, 0.45);

          // promise + sign-off
          tl.fromTo(S + ".s7-tw", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.04 }, 0.85);
          tl.fromTo(S + "#s7-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out" }, 1.35);
          tl.fromTo(S + "#s7-small", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 1.4);

          // final impact beat
          tl.to(S + "#s7-mark", { keyframes: [{ scale: 1.1, duration: 0.08 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }] }, 2.5);
          tl.to(S + "#s7-flash", { keyframes: [{ opacity: 0.18, duration: 0.05 }, { opacity: 0, duration: 0.3 }] }, 2.5);

          window.__timelines["s7-final"] = tl;
        })();
